# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin "tmux-plugins/tmux-battery"
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'sjdonado/tmux-workspace-usage'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tpm'

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

set -g base-index 1
setw -g pane-base-index 1

# Close a window and the rest renumber to fill the gap (respects base-index).
# Only fires on close — use `move-window -r` to renumber a session on demand.
set -g renumber-windows on

set -g status-right-length 100
set -g status-left-length 100

# Catppuccin theme
set -g @catppuccin_flavor 'mocha'             # latte | frappe | macchiato | mocha
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_date_time_text ' %a %m/%d %H:%M'

# Load catppuccin before assembling the status line below (it defines @catppuccin_status_*)
run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g status-position bottom
set -g status-left '#{E:@catppuccin_status_session}'

# tmux-workspace-usage reads these with `show-option -gq`, which exits 0 with
# empty output when unset — so its documented defaults never apply and every
# option has to be set explicitly or the segment renders "N/A".
set -g @workspace_usage_processes 'tmux|nvim|node'
set -g @workspace_usage_mem 'on'
set -g @workspace_usage_cpu 'on'

# Workspace usage (mem | cpu), hand-built to match the catppuccin module shape.
# Not using the plugin's #{workspace_usage} placeholder or catppuccin's
# status_module.conf helper: the former is substituted by rewriting the raw
# status-right string (which never sees it inside a module option), and the
# latter needs a %hidden MODULE_NAME that doesn't survive a queued source-file.
set -g status-right '#[fg=#{E:@thm_peach}]#{E:@catppuccin_status_left_separator}'
set -ag status-right '#[fg=#{E:@thm_crust},bg=#{E:@thm_peach}]󰍛 #{E:@catppuccin_status_middle_separator}'
set -ag status-right '#[fg=#{E:@thm_fg},bg=#{E:@thm_surface_0}] #(~/.tmux/plugins/tmux-workspace-usage/scripts/calculate.sh) '
set -ag status-right '#[fg=#{E:@thm_surface_0},bg=default]#{E:@catppuccin_status_right_separator}'

set -agF status-right '#{E:@catppuccin_status_battery}'
set -ag status-right '#{E:@catppuccin_status_date_time}'

# Windows start unnamed; `prefix + ,` is the only thing that ever names one.
# automatic-rename stays ON with an EMPTY format, so tmux actively blanks the
# name it would otherwise derive from the running command. tmux then turns
# automatic-rename off for a window the moment it's renamed by hand, so a manual
# name is permanent. allow-rename off keeps programs from renaming via the
# \033k...\033\\ escape.
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format ''
set-option -g allow-rename off

# Put session name in the terminal (Ghostty) window title so AeroSpace can locate the session
set-option -g set-titles on
set-option -g set-titles-string "#S · #T"


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# tmux-sessionx — fuzzy session picker in a popup (prefix + o).
# Options must be set before tpm runs; the plugin reads them at load time and
# binds its own key, so this can't move below the tpm line like the binds do.
# `s`/`w` are deliberately left on the built-in choose-tree (S-Up/S-Down swap).
set -g @sessionx-bind 'o'
set -g @sessionx-filter-current 'false'    # let the current session show in the list
set -g @sessionx-window-height '75%'
set -g @sessionx-window-width '65%'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
# zoxide mode stays off: zoxide isn't installed.

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# ===========================================================================
# Key bindings MUST come after tpm: tmux-pain-control binds hjkl/HJKL when tpm
# sources it, so anything set above this line gets silently overwritten.
# ===========================================================================

# Prefix is C-a, sent with the physical Ctrl key: `a` is the home-row Ctrl mod
# in ~/.config/kanata/kanata.kbd, so the home-row hold can't produce C-a.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Rebind pane movement from hjkl to mnei (Colemak: m=left, n=down, e=up, i=right)
unbind h
unbind j
unbind k
unbind l
bind m select-pane -L
bind n select-pane -D
bind e select-pane -U
bind i select-pane -R

# Pane resizing with MNEI (repeatable)
unbind H
unbind J
unbind K
unbind L
bind -r M resize-pane -L 5
bind -r N resize-pane -D 5
bind -r E resize-pane -U 5
bind -r I resize-pane -R 5

# Window switching on h/k (repeatable)
bind -r h previous-window
bind -r k next-window

# grove — git worktree × tmux session picker (prefix + g). Popup so it can
# switch-client the surrounding client and then vanish.
bind g display-popup -E -w 80% -h 70% "grove"

# Sidebar mode: a throwaway window holding the picker on the left and the chosen
# session, live and editable, in a nested client on the right. Nested, so the
# inner session's prefix is C-a C-a; prefix + m returns to the picker.
bind G new-window -n grove "grove -sidebar"
