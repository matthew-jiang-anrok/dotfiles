config-version = 2

# ── Startup ──────────────────────────────────────────────────────────────────
after-startup-command = [
    'exec-and-forget sketchybar',
    'exec-and-forget borders active_color="glow(0xff00ffaa)" inactive_color=0xff313244 width=6.0',
]

start-at-login = true
automatically-unhide-macos-hidden-apps = true

# ── Layout defaults ───────────────────────────────────────────────────────────
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# ── Tree normalizations ───────────────────────────────────────────────────────
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# ── Mouse follows focus ───────────────────────────────────────────────────────
on-focused-monitor-changed = []
on-focus-changed = []

# ── Sketchybar integration ────────────────────────────────────────────────────
# AeroSpace repaints only the two affected pills directly (no sketchybar event,
# no per-item scripts): un-highlight the workspace we left, highlight the new one.
exec-on-workspace-change = ['/bin/bash', '-c',
    "$HOME/.config/sketchybar/plugins/ws_driver.sh $AEROSPACE_FOCUSED_WORKSPACE $AEROSPACE_PREV_WORKSPACE; $HOME/.config/sketchybar/plugins/space_icons.sh"
]

# ── Key mapping ───────────────────────────────────────────────────────────────
[key-mapping]
    preset = 'qwerty'

# ── Gaps (Hyprland-style breathing room) ─────────────────────────────────────
[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = 8
    outer.bottom     = 8
    outer.top        = [{monitor.'built-in' = 16}, 48]
    outer.right      = 8

# ── Workspace → monitor assignment ────────────────────────────────────────────
# Numbered workspaces live on the laptop screen; lettered (app-home) workspaces
# live on the external, except Z[oom], which stays on the laptop.
# 'DELL' and 'MSI' match monitors by name, 'secondary' catches any other external.
# When only one monitor is attached AeroSpace falls back to it, so nothing is
# lost undocked.
[workspace-to-monitor-force-assignment]
    1 = 'built-in'
    2 = 'built-in'
    3 = 'built-in'
    C = ['DELL', 'MSI', 'secondary']
    F = ['DELL', 'MSI', 'secondary']
    N = ['DELL', 'MSI', 'secondary']
    S = ['DELL', 'MSI', 'secondary']
    T = ['DELL', 'MSI', 'secondary']
    V = ['DELL', 'MSI', 'secondary']
    Z = 'built-in'

# ── Window rules ──────────────────────────────────────────────────────────────
[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

# App → lettered workspace (on the external, except Z). Workspaces 1/2/3 stay
# unassigned scratch space on the laptop, so anything without a rule here —
# Chrome included — opens wherever you are.
# Keep this list in sync with the pill list in ~/.config/sketchybar/sketchybarrc
# and the workspace loop in plugins/space_icons.sh.
[[on-window-detected]]
    if.app-id = 'com.anthropic.claudefordesktop'
    run = 'move-node-to-workspace C'      # [C]laude

[[on-window-detected]]
    if.app-id = 'org.mozilla.firefox'
    run = 'move-node-to-workspace F'      # [F]irefox

[[on-window-detected]]
    if.app-id = 'notion.id'
    run = 'move-node-to-workspace N'      # [N]otion

[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = 'move-node-to-workspace S'      # [S]lack

[[on-window-detected]]
    if.app-id = 'com.mitchellh.ghostty'
    run = 'move-node-to-workspace T'      # [T]erminal

[[on-window-detected]]
    if.app-id = 'com.microsoft.VSCode'
    run = 'move-node-to-workspace V'      # [V]S Code

[[on-window-detected]]
    if.app-id = 'us.zoom.xos'
    run = 'move-node-to-workspace Z'      # [Z]oom

# ── Main keybindings ──────────────────────────────────────────────────────────
[mode.main.binding]

    # Cycle windows in the focused workspace (DFS order, wraps at the ends).
    # On tab, not alt-n/alt-p — those letters are workspace switches now.
    alt-tab       = 'focus --wrap-around dfs-next'
    alt-shift-tab = 'focus --wrap-around dfs-prev'

    # Move windows
    alt-shift-left = 'move left'
    alt-shift-down = 'move down'
    alt-shift-up = 'move up'
    alt-shift-right = 'move right'

    # Resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Layout toggles
    alt-slash       = 'layout tiles horizontal vertical'
    alt-comma       = 'layout accordion horizontal vertical'
    alt-shift-space = 'layout floating tiling'
    alt-m           = 'macos-native-fullscreen'   # [m]aximize; alt-f is workspace F now
    alt-shift-p     = 'exec-and-forget $HOME/.config/aerospace/scripts/toggle-padding.sh'  # toggle +400px side padding

    # Workspace switching. 1/2/3 are the free-form scratch spaces on the laptop
    # screen; the letters are app homes on the external — see the
    # on-window-detected rules and [workspace-to-monitor-force-assignment].
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-c = 'workspace C'   # Claude
    alt-f = 'workspace F'   # Firefox
    alt-n = 'workspace N'   # Notion
    alt-s = 'workspace S'   # Slack
    alt-t = 'workspace T'   # Terminal (Ghostty)
    alt-v = 'workspace V'   # VS Code
    alt-z = 'workspace Z'   # Zoom

    # Move window to workspace (refresh pill icons: a move fires no workspace-
    # change / front-app event, so trigger space_icons.sh explicitly).
    alt-shift-1 = ['move-node-to-workspace 1', 'exec-and-forget $HOME/.config/sketchybar/plugins/space_icons.sh']
    alt-shift-2 = ['move-node-to-workspace 2', 'exec-and-forget $HOME/.config/sketchybar/plugins/space_icons.sh']
    alt-shift-3 = ['move-node-to-workspace 3', 'exec-and-forget $HOME/.config/sketchybar/plugins/space_icons.sh']
    alt-shift-c = ['move-node-to-workspace C', 'exec-and-forget $HOME/.config/sketchybar/plugins/space_icons.sh']
    alt-shift-f = ['move-node-to-workspace F', 'exec-and-forget $HOME/.config/sketchybar/plugins/space_icons.sh']
    alt-shift-n = ['move-node-to-workspace N', 'exec-and-forget $HOME/.config/sketchybar/plugins/space_icons.sh']
    alt-shift-s = ['move-node-to-workspace S', 'exec-and-forget $HOME/.config/sketchybar/plugins/space_icons.sh']
    alt-shift-t = ['move-node-to-workspace T', 'exec-and-forget $HOME/.config/sketchybar/plugins/space_icons.sh']
    alt-shift-v = ['move-node-to-workspace V', 'exec-and-forget $HOME/.config/sketchybar/plugins/space_icons.sh']
    alt-shift-z = ['move-node-to-workspace Z', 'exec-and-forget $HOME/.config/sketchybar/plugins/space_icons.sh']

    # Window management
    alt-q     = 'close'
    alt-enter = 'exec-and-forget osascript -e "tell application \"Ghostty\" to new window"'

    # Mode switching
    alt-shift-semicolon = 'mode service'
    alt-shift-r         = 'mode resize'

    # Disable accidental macOS app hide shortcut
    cmd-h = []

# ── Service mode ──────────────────────────────────────────────────────────────
[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main']
    f         = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    # Join windows into a container
    alt-shift-left = ['join-with left',  'mode main']
    alt-shift-down = ['join-with down',  'mode main']
    alt-shift-up = ['join-with up',    'mode main']
    alt-shift-right = ['join-with right', 'mode main']

# ── Resize mode ───────────────────────────────────────────────────────────────
[mode.resize.binding]
    left  = 'resize width -50'
    down  = 'resize height +50'
    up    = 'resize height -50'
    right = 'resize width +50'
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    enter = 'mode main'
    esc   = 'mode main'
